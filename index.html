<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Учет Договоров</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .row-error { background-color: #fee2e2 !important; }
    .pay-paid { background-color: #22c55e; color: white; font-weight: bold; cursor: pointer; }
    .btn-history-active { background-color: #f59e0b !important; color: white !important; cursor: pointer !important; }
    .input-error { border: 2px solid #ef4444 !important; background-color: #fef2f2; }
  </style>
</head>
<body class="bg-gray-100 text-gray-800 text-xs">

  <div class="p-4 max-w-[100vw]">
    <div class="flex flex-wrap justify-between items-center mb-4 gap-4 bg-white p-4 rounded shadow border-b-2 border-blue-500">
      <div>
        <h1 class="text-xl font-bold text-gray-800">Лист Договоров</h1>
        <p class="text-[10px] text-gray-500 uppercase font-semibold">Контроль ошибок и история Undo/Redo</p>
      </div>
      
      <div class="flex items-center gap-2">
        <div class="flex bg-gray-200 rounded p-1 gap-1 mr-2">
          <button type="button" id="undoBtn" onclick="undo()" disabled class="px-3 py-2 rounded text-xs font-bold text-gray-400 bg-gray-100 cursor-not-allowed transition">↺ Назад</button>
          <button type="button" id="redoBtn" onclick="redo()" disabled class="px-3 py-2 rounded text-xs font-bold text-gray-400 bg-gray-100 cursor-not-allowed transition">↻ Вперед</button>
        </div>
        <button type="button" onclick="exportData()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-medium px-3 py-2 rounded text-xs transition">💾 Скачать</button>
        <button type="button" onclick="document.getElementById('importFile').click()" class="bg-gray-600 hover:bg-gray-700 text-white font-medium px-3 py-2 rounded text-xs transition">📂 Загрузить</button>
        <input type="file" id="importFile" onchange="importData(event)" class="hidden" accept=".json">
        <input type="text" id="searchInput" oninput="filterContracts()" placeholder="Поиск..." class="p-2 border rounded w-48 outline-none">
        <button type="button" onclick="openCreateModal()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold px-4 py-2 rounded shadow-md transition">+ Новый Договор</button>
      </div>
    </div>

    <div class="bg-white shadow-xl rounded-lg overflow-x-auto max-h-[80vh] border">
      <table class="min-w-full text-left border-collapse">
        <thead class="bg-slate-700 text-white uppercase font-bold text-[10px] sticky top-0 z-20">
          <tr>
            <th class="p-3 border-r border-slate-600">№</th>
            <th class="p-3 border-r border-slate-600 min-w-[150px]">ФИО Покупателя</th>
            <th class="p-3 border-r border-slate-600">Телефон</th>
            <th class="p-3 border-r border-slate-600">Покупка/График</th>
            <th class="p-3 border-r border-slate-600">Мес. Платеж</th>
            <script>for(let i=1; i<=15; i++) document.write(`<th class="p-1 border-r border-slate-600 text-center min-w-[65px]">${i}-й</th>`);</script>
            <th class="p-3 border-r border-slate-600 text-center">Остаток</th>
            <th class="p-3 border-r border-slate-600 text-center">Рассрочка/Пред.</th>
            <th class="p-3 border-r border-slate-600 text-center">«Д»</th>
            <th class="p-3 border-r border-slate-600">Товар</th>
            <th class="p-3 text-center sticky right-0 bg-slate-800 min-w-[210px]">Действия</th>
          </tr>
        </thead>
        <tbody id="contractsTable" class="divide-y"></tbody>
      </table>
    </div>
  </div>

  <div id="modal" class="fixed inset-0 bg-black/60 hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-xl p-6 max-w-4xl w-full max-h-[95vh] overflow-y-auto shadow-2xl">
      <h2 id="modalTitle" class="text-xl font-bold mb-4 border-b-2 pb-2 text-blue-700 uppercase">Новый договор</h2>
      <div id="errorBanner" class="hidden mb-4 p-3 bg-red-100 text-red-700 rounded font-bold text-center">⚠️ Ошибка в расчетах! Проверьте суммы.</div>
      <form id="contractForm" class="space-y-4">
        <input type="hidden" id="editDocId">
        <div class="bg-slate-50 p-4 rounded-lg border">
          <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
            <input type="text" id="fio" placeholder="ФИО *" required class="p-2 border rounded-md col-span-2">
            <input type="text" id="phone" placeholder="Телефон *" required class="p-2 border rounded-md">
            <input type="text" id="address" placeholder="Адрес" class="p-2 border rounded-md col-span-3">
          </div>
        </div>
        <div class="bg-blue-50 p-4 rounded-lg border border-blue-100">
          <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
            <input type="date" id="buyDate" required class="p-2 border rounded">
            <input type="date" id="payDate" required class="p-2 border rounded">
            <input type="number" id="monthsCount" placeholder="Срок (мес.) *" required oninput="validateFinance()" class="p-2 border rounded">
            <input type="number" id="monthlyPay" placeholder="Платеж (мес.) *" required oninput="validateFinance()" class="p-2 border rounded">
            <input type="number" id="totalCost" placeholder="Итог рассрочки *" required oninput="validateFinance()" class="p-2 border rounded">
            <input type="number" id="downPayment" placeholder="Взнос" value="0" oninput="validateFinance()" class="p-2 border rounded">
            <input type="number" id="costPrice" placeholder="Себестоимость *" required oninput="validateFinance()" class="p-2 border rounded">
            <div class="flex items-center gap-2 pt-2"><input type="checkbox" id="shopPaid"><label class="font-bold">«Д»</label></div>
          </div>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div class="p-4 border rounded bg-gray-50"><input type="text" id="product" placeholder="Товар" class="p-2 border rounded w-full"></div>
          <div class="p-4 border rounded bg-gray-50"><input type="text" id="guarantorFio" placeholder="Поручитель" class="p-2 border rounded w-full"></div>
        </div>
        <div class="flex justify-end gap-3 pt-4 border-t-2">
          <button type="button" onclick="closeModal()" class="px-6 py-2 border-2 rounded-lg font-bold">Отмена</button>
          <button type="submit" id="saveBtn" class="px-8 py-2 bg-blue-600 text-white rounded-lg font-bold shadow-lg transition">Сохранить</button>
        </div>
      </form>
    </div>
  </div>

  <div id="payModal" class="fixed inset-0 bg-black/60 hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-xl p-5 max-w-sm w-full shadow-2xl border-t-4 border-green-500">
      <form id="payForm" class="space-y-4">
        <input type="hidden" id="payContractId">
        <select id="payIndex" class="p-2 border rounded-md w-full bg-slate-50 font-bold outline-none">
          <script>for(let i=1; i<=15; i++) document.write(`<option value="${i}">${i}-й взнос</option>`);</script>
        </select>
        <input type="number" id="payAmount" required class="p-2 border rounded-md w-full text-lg font-bold text-green-700 outline-none">
        <input type="date" id="payDateVal" required class="p-2 border rounded-md w-full">
        <div class="flex justify-end gap-2"><button type="button" onclick="closePayModal()">Отмена</button><button type="submit" class="px-6 py-2 bg-green-600 text-white rounded-lg">Внести</button></div>
      </form>
    </div>
  </div>

  <script>
    let allContracts = JSON.parse(localStorage.getItem('contracts_db') || '[]');
    let undoStack = []; let redoStack = [];

    function validateFinance() {
      const months = Number(document.getElementById('monthsCount').value) || 0;
      const monthly = Number(document.getElementById('monthlyPay').value) || 0;
      const total = Number(document.getElementById('totalCost').value) || 0;
      const down = Number(document.getElementById('downPayment').value) || 0;
      const cost = Number(document.getElementById('costPrice').value) || 0;

      const calcTotal = (monthly * months) + down;
      const isMathError = calcTotal !== total;
      const isPriceError = cost > total;
      
      const hasError = isMathError || isPriceError;
      
      document.getElementById('totalCost').classList.toggle('input-error', isMathError);
      document.getElementById('costPrice').classList.toggle('input-error', isPriceError);
      document.getElementById('errorBanner').classList.toggle('hidden', !hasError);
      document.getElementById('saveBtn').disabled = hasError;
      document.getElementById('saveBtn').classList.toggle('opacity-50', hasError);
      document.getElementById('saveBtn').classList.toggle('cursor-not-allowed', hasError);
      return !hasError;
    }

    function saveState() {
      undoStack.push(JSON.stringify(allContracts));
      if (undoStack.length > 50) undoStack.shift();
      redoStack = []; updateHistoryButtons();
    }

    function undo() { if (undoStack.length === 0) return; redoStack.push(JSON.stringify(allContracts)); allContracts = JSON.parse(undoStack.pop()); finishAction(); }
    function redo() { if (redoStack.length === 0) return; undoStack.push(JSON.stringify(allContracts)); allContracts = JSON.parse(redoStack.pop()); finishAction(); }
    
    function finishAction() { localStorage.setItem('contracts_db', JSON.stringify(allContracts)); renderTable(allContracts); updateHistoryButtons(); }

    function updateHistoryButtons() {
      const uBtn = document.getElementById('undoBtn'); const rBtn = document.getElementById('redoBtn');
      uBtn.disabled = undoStack.length === 0; uBtn.className = uBtn.disabled ? "px-3 py-2 rounded text-xs font-bold text-gray-400 bg-gray-100 cursor-not-allowed" : "px-3 py-2 rounded text-xs font-bold btn-history-active";
      rBtn.disabled = redoStack.length === 0; rBtn.className = rBtn.disabled ? "px-3 py-2 rounded text-xs font-bold text-gray-400 bg-gray-100 cursor-not-allowed" : "px-3 py-2 rounded text-xs font-bold btn-history-active";
    }

    function openCreateModal() { document.getElementById('contractForm').reset(); document.getElementById('editDocId').value = ''; document.getElementById('modalTitle').innerText = 'Новый договор'; validateFinance(); document.getElementById('modal').classList.remove('hidden'); }
    function closeModal() { document.getElementById('modal').classList.add('hidden'); }
    function openPayModal(id) { document.getElementById('payContractId').value = id; document.getElementById('payDateVal').valueAsDate = new Date(); document.getElementById('payModal').classList.remove('hidden'); }
    function closePayModal() { document.getElementById('payModal').classList.add('hidden'); }

    function openEditModal(id) {
      const c = allContracts.find(i => i.id === id);
      document.getElementById('editDocId').value = id;
      document.getElementById('fio').value = c.fio; document.getElementById('phone').value = c.phone;
      document.getElementById('buyDate').value = c.buyDate; document.getElementById('payDate').value = c.payDate;
      document.getElementById('monthsCount').value = c.monthsCount; document.getElementById('monthlyPay').value = c.monthlyPay;
      document.getElementById('totalCost').value = c.totalCost; document.getElementById('downPayment').value = c.downPayment;
      document.getElementById('costPrice').value = c.costPrice; document.getElementById('shopPaid').checked = c.shopPaid;
      document.getElementById('product').value = c.product; document.getElementById('guarantorFio').value = c.guarantorFio;
      validateFinance(); document.getElementById('modal').classList.remove('hidden');
    }

    document.getElementById('contractForm').addEventListener('submit', (e) => {
      e.preventDefault(); if (!validateFinance()) return;
      saveState();
      const editId = document.getElementById('editDocId').value;
      const data = {
        fio: document.getElementById('fio').value, phone: document.getElementById('phone').value,
        buyDate: document.getElementById('buyDate').value, payDate: document.getElementById('payDate').value,
        monthsCount: Number(document.getElementById('monthsCount').value), monthlyPay: Number(document.getElementById('monthlyPay').value),
        totalCost: Number(document.getElementById('totalCost').value), downPayment: Number(document.getElementById('downPayment').value),
        costPrice: Number(document.getElementById('costPrice').value), shopPaid: document.getElementById('shopPaid').checked,
        product: document.getElementById('product').value, guarantorFio: document.getElementById('guarantorFio').value
      };
      if (editId) { const i = allContracts.findIndex(x => x.id === editId); allContracts[i] = {...allContracts[i], ...data}; }
      else { allContracts.push({ id: 'doc_'+Date.now(), contractNum: allContracts.length+1, installments: {}, ...data }); }
      finishAction(); closeModal();
    });

    document.getElementById('payForm').addEventListener('submit', (e) => {
      e.preventDefault(); saveState();
      const id = document.getElementById('payContractId').value; const contract = allContracts.find(c => c.id === id);
      const idx = document.getElementById('payIndex').value;
      contract.installments[idx] = { amount: Number(document.getElementById('payAmount').value), date: document.getElementById('payDateVal').value };
      finishAction(); closePayModal();
    });

    function deleteContract(id) { if (confirm("Удалить?")) { if (prompt('Введите "УДАЛИТЬ":') === "УДАЛИТЬ") { saveState(); allContracts = allContracts.filter(c => c.id !== id); finishAction(); } } }

    function copyToClip(text, btn) { navigator.clipboard.writeText(text).then(() => { const old = btn.innerText; btn.innerText = "✓"; setTimeout(() => btn.innerText = old, 1000); }); }

    function renderTable(contracts) {
      const tbody = document.getElementById('contractsTable'); tbody.innerHTML = '';
      contracts.forEach(item => {
        let paid = 0; Object.values(item.installments).forEach(p => paid += p.amount);
        const rest = item.totalCost - item.downPayment - paid;
        const tr = document.createElement('tr');
        let instHtml = ''; for(let i=1; i<=15; i++) { const v = item.installments[i]; instHtml += v ? `<td class="p-1 border-r text-center pay-paid">${v.amount}</td>` : `<td class="p-1 border-r text-center text-gray-300">—</td>`; }
        tr.innerHTML = `
          <td class="p-2 border-r font-bold text-center">${item.contractNum}</td>
          <td class="p-2 border-r font-bold">${item.fio}</td>
          <td class="p-2 border-r">${item.phone}</td>
          <td class="p-2 border-r text-[10px]">${item.buyDate}<br><b class="text-blue-600">${item.payDate}</b></td>
          <td class="p-2 border-r text-center">${item.monthlyPay}</td>
          ${instHtml}
          <td class="p-2 border-r font-bold text-center ${rest<=0?'text-green-600':'text-orange-600'}">${rest}</td>
          <td class="p-2 border-r text-[10px] text-center">${item.totalCost}/${item.downPayment}</td>
          <td class="p-2 border-r text-center font-black ${item.shopPaid?'text-green-600':'text-gray-300'}">${item.shopPaid?'Д':'—'}</td>
          <td class="p-2 border-r text-[10px]">${item.product || '—'}</td>
          <td class="p-2 text-center space-x-1 sticky right-0 bg-white">
            <button onclick="openPayModal('${item.id}')" class="bg-green-600 text-white px-1 py-0.5 rounded text-[9px]">+Взнос</button>
            <button onclick="openEditModal('${item.id}')" class="bg-blue-500 text-white px-1 py-0.5 rounded text-[9px]">✏️</button>
            <button onclick="deleteContract('${item.id}')" class="bg-red-500 text-white px-1 py-0.5 rounded text-[9px]">🗑️</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    function exportData() { const blob = new Blob([JSON.stringify(allContracts, null, 2)], { type: "application/json" }); const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = `BAZA_${new Date().toISOString().slice(0,10)}.json`; a.click(); }
    function importData(e) { const file = e.target.files[0]; if (!file) return; const reader = new FileReader(); reader.onload = (ev) => { try { const data = JSON.parse(ev.target.result); if (confirm(`Загрузить?`)) { saveState(); allContracts = data; finishAction(); } } catch { alert("Ошибка!"); } }; reader.readAsText(file); }
    function filterContracts() { const q = document.getElementById('searchInput').value.toLowerCase(); renderTable(allContracts.filter(c => c.fio.toLowerCase().includes(q) || String(c.contractNum).includes(q))); }

    renderTable(allContracts); updateHistoryButtons();
  </script>
</body>
</html>
